name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: contextledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: contextledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextledger -d contextledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

    env:
      # Throwaway credentials for the CI-only database container above.
      CONTEXTLEDGER_DB_HOST: 127.0.0.1
      CONTEXTLEDGER_DB_PORT: "5432"
      CONTEXTLEDGER_DB_USER: contextledger
      CONTEXTLEDGER_DB_PASSWORD: ci-only-password
      CONTEXTLEDGER_DB_NAME: contextledger
      CONTEXTLEDGER_TEST_DATABASE_URL: postgresql+asyncpg://contextledger:ci-only-password@127.0.0.1:5432/contextledger_test
      CONTEXTLEDGER_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      CONTEXTLEDGER_TEST_NEO4J_PASSWORD: ci-only-password
      # In CI a missing database is a failure, never a skip.
      CONTEXTLEDGER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        working-directory: backend
        run: mypy

      - name: Alembic upgrade to head
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic drift check (models vs migrations)
        working-directory: backend
        run: alembic check

      - name: Alembic downgrade to base and back
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest (unit + PostgreSQL integration)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build API image
        run: docker build -t contextledger-api:ci backend

      - name: Report image size
        run: docker image inspect contextledger-api:ci --format 'image size bytes={{.Size}}'

      - name: Smoke test /api/v1/health (liveness needs no database)
        run: |
          docker run -d --name api -p 8000:8000 contextledger-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Readiness reports 503 without a database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health/ready)
          echo "readiness status: $code"
          test "$code" = "503"
