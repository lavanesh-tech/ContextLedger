name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        working-directory: backend
        run: mypy

      - name: pytest
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build API image
        run: docker build -t contextledger-api:ci backend

      - name: Report image size
        run: docker image inspect contextledger-api:ci --format 'image size bytes={{.Size}}'

      - name: Smoke test /api/v1/health
        run: |
          docker run -d --name api -p 8000:8000 contextledger-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
