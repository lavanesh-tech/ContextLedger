name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: contextledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: contextledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextledger -d contextledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 20s
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

    env:
      # Throwaway credentials for the CI-only database container above.
      CONTEXTLEDGER_DB_HOST: 127.0.0.1
      CONTEXTLEDGER_DB_PORT: "5432"
      CONTEXTLEDGER_DB_USER: contextledger
      CONTEXTLEDGER_DB_PASSWORD: ci-only-password
      CONTEXTLEDGER_DB_NAME: contextledger
      CONTEXTLEDGER_TEST_DATABASE_URL: postgresql+asyncpg://contextledger:ci-only-password@127.0.0.1:5432/contextledger_test
      CONTEXTLEDGER_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      CONTEXTLEDGER_TEST_NEO4J_PASSWORD: ci-only-password
      CONTEXTLEDGER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      CONTEXTLEDGER_TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      # In CI a missing database is a failure, never a skip.
      CONTEXTLEDGER_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend (hash-checked lock file)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r backend/requirements-dev.lock
          pip install --no-deps -e "backend[dev]"

      - uses: astral-sh/setup-uv@v6

      - name: Lock files match pyproject.toml
        working-directory: backend
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o /tmp/requirements.lock -q
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 --generate-hashes -o /tmp/requirements-dev.lock -q
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
          diff <(grep -v '^#' requirements-dev.lock) <(grep -v '^#' /tmp/requirements-dev.lock)

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --require-hashes --disable-pip --progress-spinner off

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        working-directory: backend
        run: mypy

      - name: Alembic upgrade to head
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic drift check (models vs migrations)
        working-directory: backend
        run: alembic check

      - name: Alembic downgrade to base and back
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest (unit + PostgreSQL integration)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lock file)
        run: npm ci
      - name: Dependency audit (shipped packages, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker build, scan + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Lint Dockerfiles (hadolint)
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < frontend/Dockerfile

      - name: Build API image
        run: docker build --build-arg REVISION=${{ github.sha }} -t contextledger-api:ci backend

      - name: Build web image
        run: docker build -t contextledger-web:ci frontend

      - name: Scan API image (Trivy; fail on fixable critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: contextledger-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report high findings (Trivy; informational)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: contextledger-api:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Report image size
        run: docker image inspect contextledger-api:ci --format 'image size bytes={{.Size}}'

      - name: Smoke test /api/v1/health (liveness needs no database)
        run: |
          # Hardened the way production runs it: read-only root, no capabilities.
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges contextledger-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Readiness reports 503 without a database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health/ready)
          echo "readiness status: $code"
          test "$code" = "503"
