# Local development stack for ContextLedger.
#
#   cp .env.example .env     # then edit the passwords
#   make up                  # build + start everything, wait for health checks
#   make smoke               # verify every service actually answers
#
# All ports bind to 127.0.0.1 so the stack is not reachable from your network.
# The API uses PostgreSQL (Phase 2+), Neo4j (Phase 10) and Redis (Phase 14:
# retrieval cache, rate limits, idempotency keys, OAuth state, MCP session
# state). Kafka (Phase 15) carries domain events from the outbox relay to the
# event consumers. Migrations run as a separate one-off step
# (`make up` / `make migrate-docker`), never automatically at API startup.

name: contextledger

services:
  api:
    build:
      context: ./backend
    image: contextledger-api:latest
    environment: &backend-env
      CONTEXTLEDGER_ENVIRONMENT: ${CONTEXTLEDGER_ENVIRONMENT:-local}
      CONTEXTLEDGER_LOG_LEVEL: ${CONTEXTLEDGER_LOG_LEVEL:-INFO}
      CONTEXTLEDGER_LOG_JSON: ${CONTEXTLEDGER_LOG_JSON:-true}
      CONTEXTLEDGER_DOCS_ENABLED: ${CONTEXTLEDGER_DOCS_ENABLED:-true}
      # Inside the Compose network Postgres is reachable as "postgres:5432".
      CONTEXTLEDGER_DB_HOST: postgres
      CONTEXTLEDGER_DB_PORT: "5432"
      CONTEXTLEDGER_DB_USER: ${POSTGRES_USER:-contextledger}
      CONTEXTLEDGER_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CONTEXTLEDGER_DB_NAME: ${POSTGRES_DB:-contextledger}
      CONTEXTLEDGER_EMBEDDING_PROVIDER: ${CONTEXTLEDGER_EMBEDDING_PROVIDER:-deterministic}
      CONTEXTLEDGER_EMBEDDING_MODEL: ${CONTEXTLEDGER_EMBEDDING_MODEL:-text-embedding-3-small}
      CONTEXTLEDGER_OPENAI_API_KEY: ${CONTEXTLEDGER_OPENAI_API_KEY:-}
      CONTEXTLEDGER_NEO4J_URI: bolt://neo4j:7687
      CONTEXTLEDGER_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (min 8 chars)}
      # Keep REDIS_PASSWORD URL-safe (letters, digits, - _ .): it is embedded in this URL.
      CONTEXTLEDGER_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      CONTEXTLEDGER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Traces go to Jaeger when the observability profile runs (make obs-up); empty: off.
      CONTEXTLEDGER_OTEL_EXPORTER_OTLP_ENDPOINT: ${CONTEXTLEDGER_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CONTEXTLEDGER_METRICS_TOKEN: ${CONTEXTLEDGER_METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Embedding worker: same image, different command (see app/workers/embeddings.py).
    # Reuses the image built for "api" (make up builds it once).
    image: contextledger-api:latest
    pull_policy: never
    command: ["python", "-m", "app.workers.embeddings", "--heartbeat-file", "/tmp/worker.heartbeat"]
    environment:
      <<: *backend-env
      CONTEXTLEDGER_DB_APPLICATION_NAME: contextledger-embedding-worker
    # The image's HEALTHCHECK probes the API port; the worker has none, so it
    # reports healthy while it keeps touching its heartbeat file.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 600 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  graph-projector:
    # Projects PostgreSQL provenance into Neo4j from the outbox (app/workers/graph.py).
    image: contextledger-api:latest
    pull_policy: never
    command: ["python", "-m", "app.workers.graph", "--heartbeat-file", "/tmp/worker.heartbeat"]
    environment:
      <<: *backend-env
      CONTEXTLEDGER_DB_APPLICATION_NAME: contextledger-graph-projector
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 600 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  event-relay:
    # Publishes the transactional event outbox to Kafka (app/workers/event_relay.py).
    image: contextledger-api:latest
    pull_policy: never
    command: ["python", "-m", "app.workers.event_relay", "--heartbeat-file", "/tmp/worker.heartbeat"]
    environment:
      <<: *backend-env
      CONTEXTLEDGER_DB_APPLICATION_NAME: contextledger-event-relay
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 120 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  event-consumers:
    # Idempotent Kafka consumers: activity read model, retrieval-cache invalidation.
    image: contextledger-api:latest
    pull_policy: never
    command: ["python", "-m", "app.workers.event_consumers", "--heartbeat-file", "/tmp/worker.heartbeat"]
    environment:
      <<: *backend-env
      CONTEXTLEDGER_DB_APPLICATION_NAME: contextledger-event-consumers
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 120 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Official PostgreSQL image with the pgvector extension compiled in.
    image: pgvector/pgvector:pg17
    # Docker's default 64 MB /dev/shm is too small for parallel index builds
    # (e.g. HNSW over 100K vectors needs ~530 MB of shared memory).
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-contextledger}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cache / rate-limit / idempotency store only, never the system of record,
    # so persistence is disabled.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (min 8 chars)}
      # Keep the JVM small enough for a laptop.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kafka:
    # Single-node KRaft broker (no ZooKeeper). Local development only:
    # replication factor 1 and PLAINTEXT listeners are not production settings.
    image: apache/kafka:4.0.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # any fixed base64 UUID; example value from the Apache Kafka image docs
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly with chosen partition counts (app/events/kafka.py).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # --- Observability (profile "observability": make obs-up) ---------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}  # bound to 127.0.0.1 only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP from processes on your Mac
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
