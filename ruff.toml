# Ruff configuration for the whole repository (backend, benchmarks, scripts).
target-version = "py312"
line-length = 100
src = ["backend"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "DTZ",      # timezone-naive datetimes (critical for temporal data)
    "T20",      # stray print()
]

[lint.per-file-ignores]
# Tests: asserts; fake passwords; seeded (non-crypto) random data; "x is not None and x.y"
# assertions that narrow Optional types for mypy.
"backend/tests/**" = ["S101", "S105", "S106", "S311", "PT018"]
# CLI scripts: print, run git/docker/pytest, and build SQL from validated integers.
"benchmarks/scripts/**" = ["T20", "S603", "S607", "S608", "E501"]
"backend/migrations/versions/**" = ["N999"]        # 0001_*.py file names are intentional

[format]
quote-style = "double"
