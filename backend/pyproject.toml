[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextledger"
version = "0.1.0"
description = "MCP-native temporal RAG and decision-provenance platform for AI agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "neo4j>=5.23,<6",
    "mcp>=1.10,<2",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.9",
    "redis>=5.2,<9",
    "aiokafka>=0.11,<0.15",
    # LangChain core only: prompts, runnables, messages, tools. No LangGraph, no
    # langchain-openai (model access goes through app/ai/providers.py).
    "langchain-core>=1.0,<2",
    # Observability (Phase 20): Prometheus metrics, OpenTelemetry traces over OTLP/HTTP.
    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: needs a running PostgreSQL (make up); skipped locally without it, required in CI",
    "graph: also needs a running Neo4j (make up); skipped locally without it, required in CI",
    "redis: needs a running Redis (make up); skipped locally without it, required in CI",
    "kafka: needs a running Kafka broker (make up); skipped locally without it, required in CI",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]

# ---------------------------------------------------------------------------
# mypy (Ruff is configured in the repository-root ruff.toml)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

# aiokafka ships no type information; it is wrapped in app/events/kafka.py.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
