# Alembic configuration for ContextLedger.
#
# The database URL is intentionally NOT stored here: migrations/env.py builds it
# from app.core.config.Settings (CONTEXTLEDGER_DB_* environment variables), so
# credentials never live in a committed file.
#
#   make migrate                          apply all migrations (alembic upgrade head)
#   make migration m="create facts table" create a new autogenerated migration
#   make migrate-check                    fail if models and migrations have drifted

[alembic]
# The folder is "migrations", not "alembic", so it cannot shadow the installed
# alembic package for Python or mypy.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision IDs are sequential 4-digit numbers (0001, 0002, ...) passed with
# --rev-id, so the history reads in order in code review.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
