apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: contextledger}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: contextledger-app
      securityContext: &podsec
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: api}
      containers:
        - name: api
          image: contextledger-api
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: contextledger-config}
            - secretRef: {name: contextledger-secrets}
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext: &containersec
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: rds-ca, mountPath: /etc/contextledger/rds-ca, readOnly: true}]
      volumes: [{name: tmp, emptyDir: {}}, {name: rds-ca, configMap: {name: rds-ca}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
