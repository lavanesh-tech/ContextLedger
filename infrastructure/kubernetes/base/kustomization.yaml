apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contextledger
labels:
  - pairs: {app.kubernetes.io/part-of: contextledger}
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - redis.yaml
  - neo4j.yaml
  - api.yaml
  - workers.yaml
  - web.yaml
  - networkpolicy.yaml
