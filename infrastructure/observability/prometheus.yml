# Scrapes the API's /metrics. Locally no token is needed; in staging/production
# set CONTEXTLEDGER_METRICS_TOKEN and add `authorization: {credentials_file: ...}`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: contextledger-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: contextledger-api
  # `make run` on your Mac (host port 8000) when the API is not running in Compose.
  - job_name: contextledger-api-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: contextledger-api
